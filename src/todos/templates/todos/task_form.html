{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'todos/css/style.css' %}">
</head>
<body>
    <h1>Edit Task</h1>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form class="task-form" method="post">
        {% csrf_token %}
        {{ form.title }}
        {{ form.description }}
        <button type="submit">Save</button>
    </form>

    <p><a href="{% url 'task-list' %}">&larr; Back to list</a></p>
</body>
</html>
