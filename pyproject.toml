[project]
name = "md6-todo-app"
version = "0.1.0"
description = "To-Do list app (Django) for ECS Fargate + RDS Proxy + ElastiCache Redis"
readme = "README.md"
authors = [
    { name = "kwizera thierry", email = "thkwzr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1,<7.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
    "whitenoise>=6.8.0",
    "django-redis>=5.4.0",
]

[dependency-groups]
dev = [
    "flake8>=7.1.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[tool.uv]
# Application, not a library - no src package build.
package = false

[tool.ruff]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# RUF012: false positive on Django's declarative class attributes.
ignore = ["RUF012"]
